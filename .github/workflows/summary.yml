name: summary

on:
  schedule:
    - cron: "17 0 * * *" # every day at 00:17 UTC, away from the busy top of the hour
  workflow_dispatch:
    inputs:
      day:
        description: "UTC day to summarise (YYYY-MM-DD); yesterday if empty"
        required: false

permissions:
  contents: write # the summary is committed to history/
  issues: read

concurrency:
  group: summary
  cancel-in-progress: false

jobs:
  summary:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Summarise the day
        env:
          GH_TOKEN: ${{ github.token }}
          DAY: ${{ inputs.day }}
        run: scripts/summary.sh
      - name: Commit the summary
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add history/
          git diff --cached --quiet || git commit -m "chore: daily summary"
          git push
